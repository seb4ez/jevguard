[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jevguard-core"
version = "1.0.0"
description = "Deterministic decision runtime, zero-token caching, and certainty calibrator for TypeSafe AI (Jev)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "seb4ez" }
]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/seb4ez/jevguard"
Repository = "https://github.com/seb4ez/jevguard.git"

[project.scripts]
jevguard = "jevguard.cli:main"
